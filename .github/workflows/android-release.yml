name: Android release build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/duikt-release.jks
          chmod 600 keystore/duikt-release.jks
          {
            printf 'storeFile=keystore/duikt-release.jks\n'
            printf 'storePassword=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Test and build signed release
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease bundleRelease

      - name: Prepare named release APK
        id: release-apk
        shell: bash
        run: |
          version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          build_date="$(TZ=Europe/Kyiv date +'%d.%m.%Y')"
          commit_id="${GITHUB_SHA:0:7}"
          test -n "$commit_id"
          apk_name="DuiktTimetable-${version_name}-${build_date}-${commit_id}.apk"
          apk_path="app/build/outputs/apk/release/${apk_name}"
          cp app/build/outputs/apk/release/app-release.apk "$apk_path"
          printf 'apk_name=%s\n' "$apk_name" >> "$GITHUB_OUTPUT"
          printf 'apk_path=%s\n' "$apk_path" >> "$GITHUB_OUTPUT"
          printf 'version_name=%s\n' "$version_name" >> "$GITHUB_OUTPUT"
          printf 'build_date=%s\n' "$build_date" >> "$GITHUB_OUTPUT"
          printf 'commit_id=%s\n' "$commit_id" >> "$GITHUB_OUTPUT"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: duikt-timetable-release-${{ github.sha }}
          path: |
            ${{ steps.release-apk.outputs.apk_path }}
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Send release APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ steps.release-apk.outputs.apk_path }}
          VERSION_NAME: ${{ steps.release-apk.outputs.version_name }}
          BUILD_DATE: ${{ steps.release-apk.outputs.build_date }}
          COMMIT_ID: ${{ steps.release-apk.outputs.commit_id }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          test -f "$APK_PATH"
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "document=@${APK_PATH}" \
            --form-string "caption=DuiktTimetable ${VERSION_NAME} (${BUILD_DATE}, ${COMMIT_ID})"
